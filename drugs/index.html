<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藥物索引</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fffdf9; --ink:#1d2321; --muted:#68716d; --line:#e2ded5;
  --accent:#2e5fa8; --accent-soft:#e3ebf6; --mark:#fff0a8; --link:#1f5fbf; --row:#faf8f3;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141716; --card:#1c201f; --ink:#ebeee9; --muted:#9aa39f; --line:#2c3230;
  --accent:#86aef0; --accent-soft:#1f2a3d; --mark:#5a4d17; --link:#8fb8f2; --row:#202524;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
a{color:var(--link)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr)}
aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}
.sbar{padding:18px 14px 10px}
.sbar input{width:100%;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sbar input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:0 10px 40px 14px;font-size:14.5px;line-height:1.5}
.gh{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--gc,var(--muted));margin:18px 6px 6px}
.gblk.home>.gh{font-size:19px;margin:22px 0 10px;padding-bottom:4px;border-bottom:2px solid color-mix(in srgb,var(--gc) 35%,transparent)}
.gblk.home:first-child>.gh{margin-top:0}
.list .gblk button.on,.list .gblk button:hover{background:color-mix(in srgb,var(--gc) 14%,transparent);color:var(--gc)}
.gtag{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--gc);border-radius:6px;padding:0 8px;margin-right:6px}
.list button{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:8px;text-align:left;font:inherit;
  border:0;background:none;color:var(--ink);padding:4px 8px;border-radius:7px;cursor:pointer}
.list button:hover{background:var(--accent-soft)}
.list button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.list button small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.list .chip{display:inline-flex;width:auto;margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px}
main{padding:22px 32px 80px;min-width:0;max-width:1060px;width:100%;margin:0 auto}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
header.top h1{font-size:28px;margin:0;letter-spacing:.02em}
header.top span{color:var(--muted);font-size:14px;flex:1}
header.top a.kb{color:var(--accent);font-size:14px;text-decoration:none;white-space:nowrap;border:1px solid var(--line);
  background:var(--card);border-radius:10px;padding:6px 12px;font-weight:500}
.gh.fold{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.gh.fold::before{content:"▾";font-size:11px;transition:transform .15s}
.gblk.shut>.gh.fold::before{transform:rotate(-90deg)}
.gblk.shut>.gbody{display:none}
#edge{position:fixed;top:50%;left:360px;transform:translateY(-50%);z-index:31;width:20px;height:56px;padding:0;
  border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;background:var(--card);color:var(--muted);
  font-size:14px;cursor:pointer;box-shadow:2px 0 6px rgba(0,0,0,.08);transition:left .2s}
#edge:hover{color:var(--accent)}
#edge::before{content:"‹"}
@media (min-width:861px){
  body.side-hidden .layout{grid-template-columns:minmax(0,1fr)}
  body.side-hidden aside{display:none}
  body.side-hidden #edge{left:0}
  body.side-hidden #edge::before{content:"›"}
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 28px 26px}
.intro p{margin:6px 0;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 18px}
.stats b{font-size:26px;color:var(--accent);margin-right:6px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ggrid button{font:inherit;text-align:left;border:1px solid var(--line);border-left:4px solid var(--gc);
  background:color-mix(in srgb,var(--gc) 6%,var(--card));color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
.ggrid button:hover{border-color:var(--gc);border-left-width:4px}
.ggrid button b{display:block}
.ggrid button span{font-size:13px;color:var(--muted)}
h2.dn{font-size:26px;margin:0 0 6px;color:var(--gc,var(--accent))}
.clsline{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.clsline a{cursor:pointer}
details.dsec{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--card)}
details.dsec>summary{cursor:pointer;padding:8px 14px;list-style:none;display:flex;align-items:baseline;gap:8px}
details.dsec>summary::-webkit-details-marker{display:none}
details.dsec>summary::before{content:"▸";color:var(--muted);font-size:13px;transition:transform .15s}
details.dsec[open]>summary::before{transform:rotate(90deg)}
details.dsec>summary b{font-size:17px}
details.dsec>summary small{color:var(--muted);font-size:13px}
details.dsec>summary a{margin-left:auto;font-size:13px}
details.dsec>.refs{padding:0 14px 10px}
.grp{margin:12px 0 4px}
.tp{font-weight:700;font-size:15.5px}
.tp small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
a.ref{display:block;text-decoration:none;color:inherit;padding:7px 12px;margin:5px 0;border-left:3px solid var(--line);border-radius:0 8px 8px 0;background:var(--row)}
a.ref:hover{border-left-color:var(--accent);background:var(--accent-soft)}
a.ref .sec{display:block;font-size:13.5px;color:var(--accent);font-weight:600}
a.ref .sec small{color:var(--muted);font-weight:400}
a.ref .ex{display:block;font-size:14.5px;line-height:1.75}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
table.dose{width:100%;border-collapse:collapse;margin:20px 0 6px;font-size:14.5px}
table.dose caption{text-align:left;font-weight:700;color:var(--accent);padding:4px 0;font-size:16px}
table.dose th,table.dose td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:left;line-height:1.6}
table.dose th{background:var(--accent-soft)}
table.dose tr[data-href]{cursor:pointer}
table.dose tr[data-href]:hover td{background:var(--row)}
.dd{font-weight:700;white-space:nowrap}
.dv{white-space:nowrap;font-variant-numeric:tabular-nums}
.ctx{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:18px}
#top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:min(86vw,330px);z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.18)}
  body.open aside{transform:none}
  body.open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:25}
  #edge{left:0}
  #edge::before{content:"›"}
  body.open #edge{left:min(86vw,330px)}
  body.open #edge::before{content:"‹"}
  main{padding:14px 14px 70px}
  .panel{padding:16px 16px 20px}
  .dv,.dd{white-space:normal}
}
/* 標題一行：側欄與首頁卡片都不換行，括號說明用小字；放不下時以「…」收尾（滑過看全名） */
.list .gblk button{white-space:nowrap}
.list .gblk button .cn{overflow:hidden;text-overflow:ellipsis;min-width:0}
small.np{font-size:.8em;font-weight:500;color:var(--muted);margin-left:1px}
.list small.np{font-size:.74em;letter-spacing:-.01em}
.ggrid{display:flex;flex-wrap:wrap;gap:10px}
.ggrid button{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ggrid button b{display:inline}
/* 收合把手放大 */
.gh.fold{gap:8px}
.gh.fold::before{font-size:15px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;
  background:color-mix(in srgb,var(--gc,var(--muted)) 14%,transparent);color:var(--gc,var(--muted))}
.gblk.home>.gh.fold::before{font-size:17px;width:26px;height:26px}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="sbar"><input id="q" placeholder="搜尋藥名或類別" autocomplete="off" type="search"></div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <header class="top"><h1>藥物索引</h1><span>Drug Index</span>
      <a class="kb" id="kbLink" href="../">‹ 知識庫</a></header>
    <div class="panel" id="view"><div class="muted">載入中…</div></div>
  </main>
</div>
<button id="edge" title="收起／打開側欄" aria-label="收起或打開側欄"></button>
<button id="top" title="回到頂端">↑</button>
<script>
const KB = location.pathname.indexOf('/static/drugs') === 0 ? '/' : '../';
document.getElementById('kbLink').href = KB;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ABBR = new Set(['nsaid', 'ppi', 'arb', 'ssri', 'snri', 'tca', 'doac', 'lmwh', 'sglt2', 'glp-1', 'ics', 'laba', 'lama', 'nrti', 'nnrti', 'dmard', 'ivig', 'ace inhibitor']);
function cap(n) {
  const s = String(n || '');
  if (ABBR.has(s)) return s === 'ace inhibitor' ? 'ACE inhibitor' : s.toUpperCase();
  if (s === 'anti-tnf') return 'Anti-TNF';
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function stripOrd(t) {
  return String(t || '').replace(/^\s*[（(]?\s*[一二三四五六七八九十百]+\s*[）)、．.·]\s*/, '').replace(/^\s*[（(]?\d+[）).、]\s*/, '').trim();
}
let D, byCls, cur = null;
// 各藥物大類的顏色（標題、側欄、首頁卡片、類別頁共用）
const GC = { '抗生素': '#c0392b', '抗真菌': '#b9770e', '抗病毒': '#7d3c98', '抗寄生蟲': '#6e7f1c', '免疫與抗發炎': '#d35400',
  '抗腫瘤': '#a93266', '心血管': '#2e5fa8', '內分泌與代謝': '#148f77', '神經與精神': '#5b4fc4', '胸腔與腸胃': '#1f8ab0', '其他': '#6b7378' };
const gc = g => GC[g] || '#6b7378';
// 類別名的括號說明（例如「（Echinocandin、Polyene 等）」）縮小，讓名稱能排在一行
function nameHtml(n) {
  const i = n.indexOf('（');
  return i > 0 ? esc(n.slice(0, i)) + '<small class="np">' + esc(n.slice(i)) + '</small>' : esc(n);
}
// 收起來的藥物大類（側欄與首頁共用），記在這台裝置
const shut = new Set((() => { try { return JSON.parse(localStorage.getItem('drugs.shut') || '[]'); } catch (e) { return []; } })());
function toggleGroup(g) {
  shut.has(g) ? shut.delete(g) : shut.add(g);
  try { localStorage.setItem('drugs.shut', JSON.stringify([...shut])); } catch (e) { }
  document.querySelectorAll('.gh.fold').forEach(h => { if (h.dataset.g === g) h.parentNode.classList.toggle('shut', shut.has(g)); });
}
const topic = id => D.topics[id] || null;
const pageName = id => D.pages[id] || '';
// 點了開知識庫對應的主題，捲到那則條目並標出藥名
function kbHref(r, mark) {
  const t = topic(r.topic_id);
  return KB + '#/p/' + (t ? t[1] : 0) + '/t/' + r.topic_id + '/e/' + r.entry_id + '/m/' + encodeURIComponent(mark);
}

fetch('data-0d7190b1df0e.json').then(r => r.json()).then(data => {
  D = data;
  D.classes = D.classes.concat([{ key: '_none', name: '其他（未分類）', group: '其他', terms: [] }]);
  if (!D.groups.includes('其他')) D.groups.push('其他');
  byCls = new Map(D.classes.map(c => [c.key, []]));
  D.drugs.forEach(x => (byCls.get(x.cls || '_none') || byCls.get('_none')).push(x));
  byCls.forEach(l => l.sort((a, b) => (b.term - a.term) || (b.n_topics - a.n_topics) || a.name.localeCompare(b.name)));
  $('#q').oninput = () => { clearTimeout(window._qt); window._qt = setTimeout(renderList, 150); };
  renderList();
  route();
}).catch(e => { $('#view').innerHTML = '<div class="muted">資料載入失敗：' + esc(e.message) + '</div>'; });

function renderList() {
  const q = $('#q').value.trim().toLowerCase(), el = $('#list');
  if (q) {
    const cls = D.classes.filter(c => c.name.toLowerCase().includes(q) || (c.terms || []).some(t => t.includes(q)));
    const drugs = D.drugs.filter(d => d.name.includes(q))
      .sort((a, b) => (a.name.startsWith(q) ? 0 : 1) - (b.name.startsWith(q) ? 0 : 1) || b.n_topics - a.n_topics).slice(0, 200);
    el.innerHTML = (cls.length ? '<div class="gh">類別</div>' + cls.map(c => clsBtn(c)).join('') : '')
      + '<div class="gh">藥名</div>' + (drugs.length ? drugs.map(d =>
        `<button class="chip" data-drug="${esc(d.name)}">${esc(cap(d.name))}</button>`).join('') : '<div class="muted" style="padding:0 8px">沒有符合的藥名</div>');
  } else {
    el.innerHTML = D.groups.map(g => {
      const cs = D.classes.filter(c => c.group === g && (byCls.get(c.key) || []).length);
      return cs.length ? `<div class="gblk${shut.has(g) ? ' shut' : ''}" style="--gc:${gc(g)}"><div class="gh fold" data-g="${esc(g)}">${esc(g)}</div><div class="gbody">`
        + cs.map(c => clsBtn(c)).join('') + '</div></div>' : '';
    }).join('');
    el.querySelectorAll('.gh.fold').forEach(h => h.onclick = () => toggleGroup(h.dataset.g));
  }
  el.querySelectorAll('[data-cls]').forEach(b => b.onclick = () => go('c', b.dataset.cls));
  el.querySelectorAll('[data-drug]').forEach(b => b.onclick = () => go('d', b.dataset.drug));
}
function clsBtn(c) {
  const on = cur && cur[0] === 'c' && cur[1] === c.key ? ' on' : '';
  return `<button class="${on.trim()}" data-cls="${c.key}" title="${esc(c.name)}"><span class="cn">${nameHtml(c.name)}</span></button>`;
}
// 目前看的類別／藥名記在網址 hash：從知識庫按上一頁回來會停在原處
function go(kind, key) {
  location.hash = kind + '=' + encodeURIComponent(key);
  document.body.classList.remove('open');
}
window.addEventListener('hashchange', route);
function route() {
  if (!D) return;
  const m = location.hash.match(/^#([cd])=(.+)$/);
  let key = '';
  try { key = m ? decodeURIComponent(m[2]) : ''; } catch (e) { }
  cur = m ? [m[1], key] : null;
  if (!cur) home();
  else if (cur[0] === 'c') showClass(key);
  else showDrug(key);
  document.querySelectorAll('#list [data-cls]').forEach(b => b.classList.toggle('on', !!cur && cur[0] === 'c' && b.dataset.cls === cur[1]));
  const y = +sessionStorage.getItem('drugScroll:' + location.hash) || 0;
  window.scrollTo(0, y);
}
window.addEventListener('pagehide', () => { try { sessionStorage.setItem('drugScroll:' + location.hash, String(window.scrollY)); } catch (e) { } });
document.addEventListener('click', ev => {   // 離開前記住捲動位置，從知識庫回來時接著看
  if (ev.target.closest('a.ref,tr[data-href]')) try { sessionStorage.setItem('drugScroll:' + location.hash, String(window.scrollY)); } catch (e) { }
}, true);

function home() {
  $('#view').innerHTML = `${D.groups.map(g => {
      const cs = D.classes.filter(c => c.group === g && (byCls.get(c.key) || []).length);
      return cs.length ? `<div class="gblk home${shut.has(g) ? ' shut' : ''}" style="--gc:${gc(g)}"><div class="gh fold" data-g="${esc(g)}">${esc(g)}</div><div class="ggrid gbody">${cs.map(c =>
        `<button data-cls="${c.key}"><b>${nameHtml(c.name)}</b></button>`).join('')}</div></div>` : '';
    }).join('')}`;
  $('#view').querySelectorAll('[data-cls]').forEach(b => b.onclick = () => go('c', b.dataset.cls));
  $('#view').querySelectorAll('.gh.fold').forEach(h => h.onclick = () => toggleGroup(h.dataset.g));
}
function refsHtml(d) {
  const groups = new Map();
  d.refs.forEach(r => { if (!groups.has(r.topic_id)) groups.set(r.topic_id, []); groups.get(r.topic_id).push(r); });
  const re = new RegExp('(' + d.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + 's?)', 'ig');
  const hl = s => esc(s).replace(re, '<mark>$1</mark>');
  return [...groups.entries()].map(([tid, refs]) => {
    const t = topic(tid);
    return `<div class="grp"><div class="tp">${esc(t ? t[0] : '主題 ' + tid)}<small>${t ? esc(pageName(t[1])) : ''}</small></div>
      ${refs.map(r => `<a class="ref" href="${kbHref(r, d.name)}">
        <span class="sec">${esc(stripOrd(r.section) || '（未命名章節）')}<small> · ${esc(D.cats[r.category] || r.category || '')}</small></span>
        <span class="ex">${hl(r.snippet)}</span></a>`).join('')}</div>`;
  }).join('');
}
// 用藥總表：同一類每個藥在各主題寫到的劑量（後端從藥名後緊接的數字＋單位抓出來），超過 20 列拆下一張
function doseTables(members) {
  const rows = [];
  members.filter(d => !d.term).forEach(d => {
    const seen = new Set();
    d.refs.forEach(r => {
      let ds = (r.doses || []).map(x => x.dose);
      if (!ds.length) return;
      ds = ds.filter((a, i) => !ds.some((b, j) => j !== i && b.length > a.length && b.includes(a)));
      ds = [...new Set(ds)];
      const k = r.topic_id + '|' + ds.join('；');
      if (seen.has(k)) return;
      seen.add(k);
      rows.push({ drug: d.name, r, dose: ds.join('；'), ctx: (r.doses[0] || {}).ctx || '' });
    });
  });
  if (!rows.length) return '<p class="hint">這一類在內文裡沒有寫到具體劑量。</p>';
  const tables = []; let cu = [], i = 0;
  while (i < rows.length) {
    let j = i; while (j < rows.length && rows[j].drug === rows[i].drug) j++;
    const grp = rows.slice(i, j);
    if (cu.length && cu.length + grp.length > 20) { tables.push(cu); cu = []; }
    for (let k = 0; k < grp.length; k += 20) {
      const part = grp.slice(k, k + 20);
      if (cu.length + part.length > 20) { tables.push(cu); cu = []; }
      cu = cu.concat(part);
    }
    i = j;
  }
  if (cu.length) tables.push(cu);
  return tables.map(list => {
    let prev = '';
    return `<table class="dose"><caption>用藥總表</caption><thead><tr><th>藥物</th><th>使用時機</th><th>劑量</th></tr></thead><tbody>
      ${list.map(x => {
        const t = topic(x.r.topic_id), nm = x.drug === prev ? '' : esc(cap(x.drug)); prev = x.drug;
        return `<tr data-href="${kbHref(x.r, x.drug)}" title="點了開原條目"><td class="dd">${nm}</td>
          <td><b>${esc(t ? t[0] : '')}</b><span class="muted"> · ${esc(stripOrd(x.r.section))}</span>${x.ctx ? `<div class="ctx">${esc(x.ctx)}</div>` : ''}</td>
          <td class="dv">${esc(x.dose)}</td></tr>`;
      }).join('')}</tbody></table>`;
  }).join('');
}
function bindView() {
  const v = $('#view');
  v.querySelectorAll('[data-go-cls]').forEach(a => a.onclick = ev => { ev.preventDefault(); go('c', a.dataset.goCls); });
  v.querySelectorAll('[data-go-drug]').forEach(a => a.onclick = ev => { ev.preventDefault(); go('d', a.dataset.goDrug); });
  v.querySelectorAll('tr[data-href]').forEach(tr => tr.onclick = () => { location.href = tr.dataset.href; });
}
function showClass(key) {
  const c = D.classes.find(x => x.key === key);
  if (!c) return home();
  const members = byCls.get(key) || [];
  $('#view').innerHTML = `<h2 class="dn" style="--gc:${gc(c.group)}">${esc(c.name)}</h2>
    <div class="clsline"><span class="gtag" style="--gc:${gc(c.group)}">${esc(c.group)}</span> ${members.length} 種藥物</div>
    ${members.map(d => `<details class="dsec"${members.length <= 3 ? ' open' : ''}>
      <summary><b>${esc(cap(d.name))}</b><small>${d.term ? '類別總稱 · ' : ''}${d.n_topics} 個主題</small>
        <a href="#d=${encodeURIComponent(d.name)}" data-go-drug="${esc(d.name)}">單獨看 →</a></summary>
      <div class="refs">${refsHtml(d)}</div></details>`).join('')}
    ${doseTables(members)}`;
  bindView();
}
function showDrug(name) {
  const d = D.drugs.find(x => x.name === name);
  if (!d) return home();
  const key = d.cls || '_none', c = D.classes.find(x => x.key === key);
  const sib = (byCls.get(key) || []).filter(x => x.name !== name);
  $('#view').innerHTML = `<h2 class="dn" style="--gc:${gc(c ? c.group : '其他')}">${esc(cap(d.name))}</h2>
    <div class="clsline">類別：<a href="#c=${encodeURIComponent(key)}" data-go-cls="${key}">${esc(c ? c.name : '其他')}</a> · 出現在 ${d.n_topics} 個主題
      ${sib.length ? `<br>同類：${sib.slice(0, 20).map(x => `<a href="#d=${encodeURIComponent(x.name)}" data-go-drug="${esc(x.name)}">${esc(cap(x.name))}</a>`).join('、')}${sib.length > 20 ? '…' : ''}` : ''}</div>
    ${refsHtml(d)}`;
  bindView();
}
// 側欄把手：桌機收起／打開整個側欄（記住），手機當抽屜
const mq = matchMedia('(max-width:860px)');
function setHidden(h) { document.body.classList.toggle('side-hidden', h); try { localStorage.setItem('drugs.sideHidden', h ? '1' : ''); } catch (e) { } }
try { if (localStorage.getItem('drugs.sideHidden')) document.body.classList.add('side-hidden'); } catch (e) { }
$('#edge').onclick = () => mq.matches ? document.body.classList.toggle('open') : setHidden(!document.body.classList.contains('side-hidden'));
document.body.addEventListener('click', ev => { if (document.body.classList.contains('open') && !ev.target.closest('aside,#edge')) document.body.classList.remove('open'); });
const topBtn = $('#top');
addEventListener('scroll', () => { topBtn.style.display = scrollY > 600 ? 'block' : 'none'; }, { passive: true });
topBtn.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
</script>
